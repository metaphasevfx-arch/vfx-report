<!doctype html>
<html lang="ru">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClapKit VFX Dashboard</title>
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">
          <img src="assets/clapkit-logo.svg" alt="ClapKit logo" />
        </div>
        <div>
          <div class="brand-title">ClapKit</div>
          <div class="brand-subtitle" id="brandSubtitle">Your film. In sync.</div>
        </div>
      </div>
      <div class="project-title-wrap">
        <button class="sidebar-toggle" id="sidebarToggle" type="button" title="Toggle sidebar" aria-label="Toggle sidebar">☰</button>
        <div class="project-title" id="projectTitle">Проект</div>
      </div>
      <div class="profile">
        <div class="profile-avatar" id="profileAvatar">🌵</div>
        <div>
          <div class="profile-name" id="profileName">—</div>
          <div class="profile-role" id="profileRole">—</div>
        </div>
        <div class="profile-chevron">⌄</div>
      </div>
    </header>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-scroll">
          <div class="sidebar-title" id="overviewTitle">Обзор</div>
          <div class="mode-toggle">
            <button id="modeDays" class="active" type="button">Дни</button>
            <button id="modeScenes" type="button">Сцены</button>
          </div>
          <div id="sidebarContent"></div>
        </div>
        <div class="sidebar-footer">
          <div class="sidebar-title" id="projectFooterTitle">Проекты</div>
          <div class="sidebar-project-name" id="projectFooterName">—</div>
        </div>
      </aside>
      <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Close sidebar"></button>

      <main class="main">
        <section class="card control-card" id="controlCard"></section>

        <div class="content-grid">
          <div class="left-stack">
            <section class="card section-card">
              <div class="section-head">
                <h3 class="section-title" id="stillTitle">CAMERA STILL</h3>
              </div>
              <div id="stillContainer"></div>
            </section>

            <section class="card section-card">
              <h3 class="section-title" id="referenceTitle">REFERENCE PHOTOS</h3>
              <div id="referenceContainer"></div>
            </section>

            <section class="card section-card">
              <h3 class="section-title" id="downloadsTitle">DOWNLOADS</h3>
              <div id="downloadsContainer"></div>
            </section>

            <section class="card section-card notes-card">
              <div class="section-head">
                <h3 class="section-title" id="notesTitle">VFX NOTES</h3>
                <span class="section-icon section-edit" aria-hidden="true">✎</span>
              </div>
              <p class="text-label" id="shortLabel">Short description</p>
              <div class="notes-box" id="shortText">—</div>
              <p class="text-label" id="notesLabel">Notes</p>
              <div class="notes-box" id="notesText">—</div>
            </section>
          </div>

          <div class="right-stack">
            <section class="card section-card">
              <h3 class="section-title" id="paramsTitle">CAMERA PARAMETERS</h3>
              <div class="params-grid" id="paramsGrid"></div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" type="button" id="lightboxClose">×</button>
    <img id="lightboxImage" alt="photo preview" />
  </div>

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeLightbox();
        closeSidebar();
      }
    });
    window.addEventListener("resize", syncResponsiveSidebarState);

    syncResponsiveSidebarState();

    init();

    async function init() {
      const embeddedNode = document.getElementById("clapkitProjectData");
      if (embeddedNode?.textContent?.trim()) {
        try {
          dashboard = JSON.parse(embeddedNode.textContent);
        } catch (_) {
          dashboard = null;
        }
      }

      if (!dashboard) {
        try {
          const response = await fetch("data/project.json", { cache: "no-store" });
          dashboard = await response.json();
        } catch (_) {
          document.body.innerHTML = "<main style='padding:24px;font-family:-apple-system,Segoe UI,sans-serif;'>Не удалось открыть экспорт VFX.</main>";
          return;
        }
      }

      labels = dashboard?.meta?.language === "en" ? LABELS_EN : LABELS_RU;
      normalizeSceneNamesAndOrder();
      applyMeta();
      ensureSelection();
      renderSidebar();
      renderMain();
    }

    function applyMeta() {
      const meta = dashboard?.meta || {};
      elements.projectTitle.textContent = meta.projectTitle || "ClapKit";
      elements.projectFooterName.textContent = meta.projectTitle || "ClapKit";
      elements.profileAvatar.textContent = meta.profileAvatar || "🌵";
      elements.profileName.textContent = meta.profileName || labels.noValue;
      elements.profileRole.textContent = meta.profileRole || labels.noValue;
      elements.brandSubtitle.textContent = dashboard?.meta?.language === "en" ? "Your film. In sync." : "Всё под контролем";
      elements.overviewTitle.textContent = labels.overview;
      elements.modeDays.textContent = labels.days;
      elements.modeScenes.textContent = labels.scenes;
      elements.projectFooterTitle.textContent = (labels.projects || labels.project).toUpperCase();
      elements.stillTitle.textContent = labels.still;
      elements.referenceTitle.textContent = labels.references;
      elements.downloadsTitle.textContent = labels.downloads;
      elements.notesTitle.textContent = labels.notesTitle;
      elements.shortLabel.textContent = labels.shortDescription;
      elements.notesLabel.textContent = labels.notes;
    }

    function isMobileViewport() {
      return window.matchMedia("(max-width: 900px)").matches;
    }

    function closeSidebar() {
      if (isMobileViewport()) {
        elements.app.classList.add("sidebar-hidden");
      }
    }

    function syncResponsiveSidebarState() {
      const isMobile = isMobileViewport();

      if (isMobile && !wasMobileViewport) {
        elements.app.classList.add("sidebar-hidden");
      } else if (!isMobile && wasMobileViewport) {
        elements.app.classList.remove("sidebar-hidden");
      } else if (isMobile && !elements.app.classList.contains("sidebar-hidden")) {
        // Keep the main content visible first on phones.
        elements.app.classList.add("sidebar-hidden");
      }

      wasMobileViewport = isMobile;
    }

    function days() {
      return dashboard?.days || [];
    }

    function firstSceneTimestamp(scene) {
      const timestamps = (scene?.takes || [])
        .map((take) => Date.parse(String(take?.timestamp || "")))
        .filter(Number.isFinite)
        .sort((left, right) => left - right);
      return timestamps.length ? timestamps[0] : Number.POSITIVE_INFINITY;
    }

    function normalizeSceneName(scene) {
      const raw = String(scene?.name || "").trim();
      const lower = raw.toLowerCase();

      if (lower.startsWith("kat ")) return `Cat ${raw.slice(4).trim()}`;
      if (lower.startsWith("cat ")) return `Cat ${raw.slice(4).trim()}`;
      if (lower === "2-2.1") return "Cat 2-2.1";

      if (lower === "6-6.1") {
        // In source export both scenes share the same short name, so split by call-time block.
        return firstSceneTimestamp(scene) >= Date.parse("2026-05-12T16:00:00.000Z")
          ? "Cat 6-6.1"
          : "Ej 6-6.1";
      }

      if (lower.startsWith("ej ")) return `Ej ${raw.slice(3).trim()}`;
      return `Ej ${raw}`;
    }

    function normalizeSceneNamesAndOrder() {
      days().forEach((day) => {
        const sourceScenes = day?.scenes || [];
        sourceScenes.forEach((scene) => {
          scene.name = normalizeSceneName(scene);
        });

        day.scenes = sourceScenes.slice().sort((left, right) => {
          const leftKey = normalizeSceneKey(left?.name);
          const rightKey = normalizeSceneKey(right?.name);
          const leftRank = SCENE_ORDER_INDEX.has(leftKey) ? SCENE_ORDER_INDEX.get(leftKey) : Number.POSITIVE_INFINITY;
          const rightRank = SCENE_ORDER_INDEX.has(rightKey) ? SCENE_ORDER_INDEX.get(rightKey) : Number.POSITIVE_INFINITY;
          if (leftRank !== rightRank) return leftRank - rightRank;

          const byTime = firstSceneTimestamp(left) - firstSceneTimestamp(right);
          if (Number.isFinite(byTime) && byTime !== 0) return byTime;
          return String(left?.id || "").localeCompare(String(right?.id || ""));
        });
      });
    }

    function allSceneRefs() {
      return days().flatMap((day, dayIndex) =>
        (day.scenes || []).map((scene, sceneIndex) => ({ day, dayIndex, scene, sceneIndex }))
      );
    }

    function currentDay() {
      return days().find((day) => day.id === state.selectedDayID) || null;
    }

    function currentScene() {
      const day = currentDay();
      if (!day) return null;
      return (day.scenes || []).find((scene) => scene.id === state.selectedSceneID) || null;
    }

    function shotNumbers(scene) {
      return scene?.shotNumbers || [];
    }

    function takesForShot(scene, shotNumber) {
      return (scene?.takes || [])
        .filter((take) => take.shotNumber === shotNumber)
        .sort((a, b) => {
          if (a.dubNumber !== b.dubNumber) return a.dubNumber - b.dubNumber;
          return String(a.timestamp || "").localeCompare(String(b.timestamp || ""));
        });
    }

    function compareAlphaNumericID(left, right) {
      const normalize = (value) => {
        const source = String(value || "").toUpperCase();
        const prefix = (source.match(/[A-Z]+/) || [""])[0];
        const number = parseInt((source.match(/\d+/) || ["0"])[0], 10) || 0;
        return { prefix, number, source };
      };

      const a = normalize(left);
      const b = normalize(right);
      if (a.prefix !== b.prefix) return a.prefix.localeCompare(b.prefix);
      if (a.number !== b.number) return a.number - b.number;
      return a.source.localeCompare(b.source);
    }

    function allCameraItems() {
      const items = [];
      allSceneRefs().forEach(({ day, scene }) => {
        (scene?.takes || []).forEach((take) => {
          (take?.cameras || []).forEach((camera) => {
            const roll = String(camera?.mediaID || "").trim();
            const fileID = String(camera?.fileID || "").trim();
            if (!roll.length && !fileID.length) return;
            items.push({
              day,
              scene,
              take,
              camera,
              shotNumber: take?.shotNumber || "",
              roll,
              fileID,
              timestamp: String(take?.timestamp || "")
            });
          });
        });
      });
      return items;
    }

    function uniqueFileItemsForRoll(cameraItems, roll) {
      const candidates = cameraItems.filter((item) => item.roll === roll);
      const byFile = new Map();
      candidates.forEach((item) => {
        if (!item.fileID) return;
        const existing = byFile.get(item.fileID);
        if (!existing) {
          byFile.set(item.fileID, item);
          return;
        }
        const currentTime = Date.parse(existing.timestamp || "") || 0;
        const nextTime = Date.parse(item.timestamp || "") || 0;
        if (nextTime < currentTime) {
          byFile.set(item.fileID, item);
        }
      });

      return Array.from(byFile.values()).sort((left, right) => {
        const fileCompare = compareAlphaNumericID(left.fileID, right.fileID);
        if (fileCompare !== 0) return fileCompare;
        const leftTime = Date.parse(left.timestamp || "") || 0;
        const rightTime = Date.parse(right.timestamp || "") || 0;
        return leftTime - rightTime;
      });
    }

    function setSelectionFromCameraItem(item) {
      if (!item) return;
      state.selectedDayID = item.day?.id || state.selectedDayID;
      state.selectedSceneID = item.scene?.id || state.selectedSceneID;
      state.selectedShot = item.shotNumber || state.selectedShot;
      state.selectedTakeID = item.take?.id || state.selectedTakeID;
      state.selectedCameraLetter = item.camera?.letter || state.selectedCameraLetter;
      state.selectedRoll = item.roll || state.selectedRoll;
      state.selectedFileID = item.fileID || state.selectedFileID;
    }

    function ensureSelection() {
      const list = days();
      if (!list.length) {
        state.selectedDayID = null;
        state.selectedSceneID = null;
        state.selectedShot = null;
        state.selectedTakeID = null;
        state.selectedCameraLetter = null;
        state.selectedRoll = null;
        state.selectedFileID = null;
        return;
      }

      if (!state.selectedDayID || !list.some((day) => day.id === state.selectedDayID)) {
        state.selectedDayID = list[0].id;
      }

      const day = currentDay();
      const scenes = day?.scenes || [];
      if (!scenes.length) {
        state.selectedSceneID = null;
        state.selectedShot = null;
        state.selectedTakeID = null;
        state.selectedCameraLetter = null;
        state.selectedRoll = null;
        state.selectedFileID = null;
        return;
      }

      if (!state.selectedSceneID || !scenes.some((scene) => scene.id === state.selectedSceneID)) {
        state.selectedSceneID = scenes[0].id;
      }

      const scene = currentScene();
      const shots = shotNumbers(scene);
      if (!shots.length) {
        state.selectedShot = null;
        state.selectedTakeID = null;
        state.selectedCameraLetter = null;
        state.selectedRoll = null;
        state.selectedFileID = null;
        return;
      }

      if (!state.selectedShot || !shots.includes(state.selectedShot)) {
        state.selectedShot = shots[0];
      }

      const takes = takesForShot(scene, state.selectedShot);
      if (!takes.length) {
        state.selectedTakeID = null;
        state.selectedCameraLetter = scene?.cameraLetters?.[0] || null;
        state.selectedRoll = null;
        state.selectedFileID = null;
        return;
      }

      if (!state.selectedTakeID || !takes.some((take) => take.id === state.selectedTakeID)) {
        state.selectedTakeID = takes[0].id;
        state.selectedRoll = null;
        state.selectedFileID = null;
      }

      const take = takes.find((item) => item.id === state.selectedTakeID) || takes[0];
      const letters = (take?.cameras || []).map((camera) => camera.letter).filter(Boolean);
      if (!letters.length) {
        state.selectedCameraLetter = scene?.cameraLetters?.[0] || null;
      } else if (!state.selectedCameraLetter || !letters.includes(state.selectedCameraLetter)) {
        state.selectedCameraLetter = letters[0];
      }

      syncCollapsedDays(list);
    }

    function syncCollapsedDays(list) {
      const validIDs = new Set((list || []).map((day) => day.id));
      Array.from(collapsedDayIDs).forEach((id) => {
        if (!validIDs.has(id)) collapsedDayIDs.delete(id);
      });

      if (!collapsedDayIDs.size && list.length > 1) {
        list.forEach((day) => {
          if (day.id !== state.selectedDayID) collapsedDayIDs.add(day.id);
        });
      }

      if (state.selectedDayID) {
        collapsedDayIDs.delete(state.selectedDayID);
      }
    }

    function renderSidebar() {
      elements.modeDays.classList.toggle("active", state.mode === "days");
      elements.modeScenes.classList.toggle("active", state.mode === "scenes");

      const list = days();
      if (!list.length) {
        elements.sidebarContent.innerHTML = `<p class="empty-note">${labels.noData}</p>`;
        return;
      }

      if (state.mode === "scenes") {
        const refs = allSceneRefs();
        elements.sidebarContent.innerHTML = `
          <div class="scene-list">
            ${refs.map(({ day, scene }) => {
              const active = scene.id === state.selectedSceneID;
              return `
                <button class="scene-item ${active ? "active" : ""}" data-day-id="${escapeAttr(day.id)}" data-scene-id="${escapeAttr(scene.id)}">
                  <span class="dot"></span>
                  <span>${escapeHTML(sceneLabel(scene))}</span>
                </button>
              `;
            }).join("")}
          </div>
        `;
      } else {
        elements.sidebarContent.innerHTML = list.map((day) => {
          const scenes = day.scenes || [];
          const isCollapsed = collapsedDayIDs.has(day.id);
          return `
            <section class="day-group ${isCollapsed ? "collapsed" : ""}" data-day-group-id="${escapeAttr(day.id)}">
              <button class="day-header" type="button" data-day-toggle-id="${escapeAttr(day.id)}">
                <span class="day-header-main">
                  <span class="day-header-name">${escapeHTML(day.name || labels.dayWord)}</span>
                  <span class="day-header-count">${scenes.length} ${labels.sceneWord}</span>
                </span>
                <span class="day-chevron">⌄</span>
              </button>
              <div class="scene-list">
                ${scenes.map((scene) => {
                  const active = scene.id === state.selectedSceneID;
                  return `
                    <button class="scene-item ${active ? "active" : ""}" data-day-id="${escapeAttr(day.id)}" data-scene-id="${escapeAttr(scene.id)}">
                      <span class="dot"></span>
                      <span>${escapeHTML(sceneLabel(scene))}</span>
                    </button>
                  `;
                }).join("")}
              </div>
            </section>
          `;
        }).join("");
      }

      elements.sidebarContent.querySelectorAll("[data-scene-id]").forEach((button) => {
        button.addEventListener("click", () => {
          state.selectedDayID = button.getAttribute("data-day-id");
          collapsedDayIDs.delete(state.selectedDayID);
          state.selectedSceneID = button.getAttribute("data-scene-id");
          state.selectedShot = null;
          state.selectedTakeID = null;
          state.selectedCameraLetter = null;
          state.selectedRoll = null;
          state.selectedFileID = null;
          ensureSelection();
          renderSidebar();
          renderMain();
          closeSidebar();
        });
      });

      elements.sidebarContent.querySelectorAll("[data-day-toggle-id]").forEach((button) => {
        button.addEventListener("click", () => {
          const dayID = button.getAttribute("data-day-toggle-id");
          if (!dayID) return;
          if (collapsedDayIDs.has(dayID)) {
            collapsedDayIDs.delete(dayID);
          } else {
            collapsedDayIDs.add(dayID);
          }
          renderSidebar();
        });
      });
    }

    function renderMain() {
      ensureSelection();
      const scene = currentScene();
      if (!scene) {
        elements.controlCard.innerHTML = `<p class="empty-note">${labels.noData}</p>`;
        elements.stillContainer.innerHTML = `<p class="empty-note">${labels.noData}</p>`;
        elements.referenceContainer.innerHTML = `<p class="empty-note">${labels.noData}</p>`;
        elements.downloadsContainer.innerHTML = `<p class="empty-note">${labels.noData}</p>`;
        elements.shortText.textContent = labels.noValue;
        elements.notesText.textContent = labels.noValue;
        elements.paramsGrid.innerHTML = "";
        return;
      }

      const allScenesCount = allSceneRefs().length;
      const sceneRefs = allSceneRefs();
      const shots = shotNumbers(scene);
      const shotIndex = Math.max(0, shots.indexOf(state.selectedShot));
      const takes = takesForShot(scene, state.selectedShot);
      const currentTake = takes.find((take) => take.id === state.selectedTakeID) || takes[0] || null;
      const cameraLetters = (currentTake?.cameras || []).map((camera) => camera.letter).filter(Boolean);

      if (!cameraLetters.length && scene.cameraLetters?.length) {
        if (!state.selectedCameraLetter || !scene.cameraLetters.includes(state.selectedCameraLetter)) {
          state.selectedCameraLetter = scene.cameraLetters[0];
        }
      } else if (cameraLetters.length && (!state.selectedCameraLetter || !cameraLetters.includes(state.selectedCameraLetter))) {
        state.selectedCameraLetter = cameraLetters[0];
      }

      const globalCameraItems = allCameraItems();
      const rollOptions = Array.from(
        new Set(globalCameraItems.map((item) => item.roll).filter(Boolean))
      ).sort(compareAlphaNumericID);

      const currentCamera = resolveCurrentCamera(scene, currentTake);
      const preferredRoll = String(currentCamera?.mediaID || "").trim();
      if (rollOptions.length) {
        if (!state.selectedRoll || !rollOptions.includes(state.selectedRoll)) {
          state.selectedRoll = preferredRoll && rollOptions.includes(preferredRoll)
            ? preferredRoll
            : rollOptions[0];
        }
      } else {
        state.selectedRoll = null;
      }

      const fileItems = state.selectedRoll
        ? uniqueFileItemsForRoll(globalCameraItems, state.selectedRoll)
        : [];

      if (fileItems.length) {
        const preferredFileID = String(currentCamera?.fileID || "").trim();
        if (!state.selectedFileID || !fileItems.some((item) => item.fileID === state.selectedFileID)) {
          state.selectedFileID = preferredFileID && fileItems.some((item) => item.fileID === preferredFileID)
            ? preferredFileID
            : fileItems[0].fileID;
        }
      } else {
        state.selectedFileID = null;
      }

      const globalSelectionItem = fileItems.find((item) => item.fileID === state.selectedFileID) || fileItems[0] || null;
      const isDifferentSelection = globalSelectionItem
        && (
          globalSelectionItem.day?.id !== state.selectedDayID
          || globalSelectionItem.scene?.id !== state.selectedSceneID
          || globalSelectionItem.take?.id !== state.selectedTakeID
          || globalSelectionItem.shotNumber !== state.selectedShot
        );
      if (isDifferentSelection) {
        setSelectionFromCameraItem(globalSelectionItem);
        ensureSelection();
        renderSidebar();
        renderMain();
        return;
      }

      elements.controlCard.innerHTML = `
        <div class="control-cell">
          <p class="control-label">${labels.sceneLabel}</p>
          <select class="control-select control-select-scene" id="sceneSelect">
            ${sceneRefs.map((item) => `<option value="${escapeAttr(item.scene.id)}" ${item.scene.id === state.selectedSceneID ? "selected" : ""}>${escapeHTML(sceneDisplayNumber(item.scene.name))}</option>`).join("")}
          </select>
          <p class="control-sub">${escapeHTML(labels.sceneSub.replace("{count}", String(allScenesCount)))}</p>
        </div>
        <div class="control-cell">
          <p class="control-label">${labels.shotLabel}</p>
          <select class="control-select" id="shotSelect">
            ${shots.map((shot) => `<option value="${escapeAttr(shot)}" ${shot === state.selectedShot ? "selected" : ""}>${escapeHTML(shot)}</option>`).join("")}
          </select>
          <p class="control-sub">${escapeHTML(labels.shotSub.replace("{index}", String(shotIndex + 1)).replace("{count}", String(shots.length)))}</p>
        </div>
        <div class="control-cell">
          <p class="control-label">${labels.takeLabel}</p>
          <select class="control-select" id="takeSelect">
            ${takes.map((take, index) => `<option value="${escapeAttr(take.id)}" ${(take.id === state.selectedTakeID || (!state.selectedTakeID && index === 0)) ? "selected" : ""}>${escapeHTML(String(take.dubNumber))}</option>`).join("")}
          </select>
          <p class="control-sub">${escapeHTML(labels.takeSub.replace("{count}", String(takes.length)))}</p>
        </div>
        <div class="control-cell">
          <p class="control-label">${labels.rollLabel}</p>
          <select class="control-select control-select-id" id="rollSelect">
            ${rollOptions.length
              ? rollOptions.map((roll) => `<option value="${escapeAttr(roll)}" ${roll === state.selectedRoll ? "selected" : ""}>${escapeHTML(roll)}</option>`).join("")
              : `<option value="">${escapeHTML(labels.noValue)}</option>`
            }
          </select>
        </div>
        <div class="control-cell">
          <p class="control-label">${labels.fileLabel}</p>
          <select class="control-select control-select-id" id="fileSelect">
            ${fileItems.length
              ? fileItems.map((item) => `<option value="${escapeAttr(item.fileID)}" ${item.fileID === state.selectedFileID ? "selected" : ""}>${escapeHTML(item.fileID)}</option>`).join("")
              : `<option value="">${escapeHTML(labels.noValue)}</option>`
            }
          </select>
        </div>
        <div class="control-cell">
          <p class="control-label">${labels.multicam}</p>
          <div class="multicam-buttons" id="multicamButtons">
            ${(cameraLetters.length ? cameraLetters : (scene.cameraLetters || [])).map((letter) => `
              <button class="multicam-button ${letter === state.selectedCameraLetter ? "active" : ""}" type="button" data-camera-letter="${escapeAttr(letter)}">${escapeHTML(letter)}</button>
            `).join("")}
          </div>
        </div>
      `;

      const sceneSelect = document.getElementById("sceneSelect");
      if (sceneSelect) {
        sceneSelect.addEventListener("change", () => {
          const targetSceneID = sceneSelect.value;
          const targetRef = sceneRefs.find((item) => item.scene.id === targetSceneID) || null;
          if (!targetRef) return;
          state.selectedDayID = targetRef.day.id;
          collapsedDayIDs.delete(targetRef.day.id);
          state.selectedSceneID = targetRef.scene.id;
          state.selectedShot = null;
          state.selectedTakeID = null;
          state.selectedCameraLetter = null;
          state.selectedRoll = null;
          state.selectedFileID = null;
          ensureSelection();
          renderSidebar();
          renderMain();
        });
      }

      const shotSelect = document.getElementById("shotSelect");
      if (shotSelect) {
        shotSelect.addEventListener("change", () => {
          state.selectedShot = shotSelect.value;
          state.selectedTakeID = null;
          state.selectedCameraLetter = null;
          state.selectedRoll = null;
          state.selectedFileID = null;
          renderMain();
        });
      }

      const takeSelect = document.getElementById("takeSelect");
      if (takeSelect) {
        takeSelect.addEventListener("change", () => {
          state.selectedTakeID = takeSelect.value;
          state.selectedCameraLetter = null;
          state.selectedRoll = null;
          state.selectedFileID = null;
          renderMain();
        });
      }

      const rollSelect = document.getElementById("rollSelect");
      if (rollSelect) {
        rollSelect.addEventListener("change", () => {
          const roll = rollSelect.value;
          state.selectedRoll = roll;
          const nextFiles = uniqueFileItemsForRoll(globalCameraItems, roll);
          const firstMatch = nextFiles[0] || null;
          state.selectedFileID = firstMatch?.fileID || null;
          setSelectionFromCameraItem(firstMatch);
          if (state.selectedDayID) {
            collapsedDayIDs.delete(state.selectedDayID);
          }
          ensureSelection();
          renderSidebar();
          renderMain();
        });
      }

      const fileSelect = document.getElementById("fileSelect");
      if (fileSelect) {
        fileSelect.addEventListener("change", () => {
          const fileID = fileSelect.value;
          state.selectedFileID = fileID;
          const selectedFileItem = fileItems.find((item) => item.fileID === fileID) || null;
          setSelectionFromCameraItem(selectedFileItem);
          if (state.selectedDayID) {
            collapsedDayIDs.delete(state.selectedDayID);
          }
          ensureSelection();
          renderSidebar();
          renderMain();
        });
      }

      const multicamButtons = document.querySelectorAll("[data-camera-letter]");
      multicamButtons.forEach((button) => {
        button.addEventListener("click", () => {
          state.selectedCameraLetter = button.getAttribute("data-camera-letter");
          state.selectedRoll = null;
          state.selectedFileID = null;
          renderMain();
        });
      });

      const still = resolveCameraStill(scene);
      if (still?.imagePath) {
        elements.stillContainer.innerHTML = `
          <button class="still-wrap" type="button" data-lightbox-src="${escapeAttr(still.imagePath)}">
            <img src="${escapeAttr(still.imagePath)}" alt="Camera still" />
          </button>
        `;
      } else {
        elements.stillContainer.innerHTML = `<div class="still-wrap"><div class="still-empty">${escapeHTML(labels.emptyPhotos)}</div></div>`;
      }

      const refs = (scene.referencePhotos || []).filter((photo) => photo.shotNumber === state.selectedShot);
      if (!refs.length) {
        elements.referenceContainer.innerHTML = `<p class="empty-note">${labels.emptyPhotos}</p>`;
      } else {
        elements.referenceContainer.innerHTML = `
          <div class="ref-grid">
            ${refs.map((photo) => `
              <button class="ref-tile" type="button" data-lightbox-src="${escapeAttr(photo.imagePath)}">
                <img src="${escapeAttr(photo.imagePath)}" alt="Reference photo" />
              </button>
            `).join("")}
          </div>
        `;
      }

      const materials = sceneMaterialsForLinks(scene);
      const materialButtons = [];
      if (materials.refVideo) {
        materialButtons.push(`<a class="asset-button" href="${escapeAttr(materials.refVideo)}" target="_blank" rel="noopener noreferrer">${escapeHTML(labels.refVideo)}</a>`);
      }
      if (materials.hdr) {
        materialButtons.push(`<a class="asset-button" href="${escapeAttr(materials.hdr)}" target="_blank" rel="noopener noreferrer">${escapeHTML(labels.hdr)}</a>`);
      }

      if (!materialButtons.length) {
        elements.downloadsContainer.innerHTML = `<p class="empty-note">${labels.emptyMaterials}</p>`;
      } else {
        elements.downloadsContainer.innerHTML = `
          <div class="asset-grid">
            ${materialButtons.join("")}
          </div>
        `;
      }

      elements.shortText.textContent = normalizeText(currentTake?.shortDescription);
      elements.notesText.textContent = normalizeText(currentTake?.notes);

      const params = cameraParameters(currentCamera);
      elements.paramsTitle.textContent = `${labels.paramsBase} (${state.selectedCameraLetter || "A"})`;
      elements.paramsGrid.innerHTML = params.map((item) => `
        <article class="param-card">
          <div class="param-top">
            <p class="param-name">${escapeHTML(item.name)}</p>
          </div>
          <p class="param-value">${escapeHTML(item.value)}</p>
        </article>
      `).join("");

      document.querySelectorAll("[data-lightbox-src]").forEach((button) => {
        button.addEventListener("click", () => openLightbox(button.getAttribute("data-lightbox-src")));
      });
    }

    function resolveCurrentCamera(scene, take) {
      const fromTake = (take?.cameras || []).find((camera) => camera.letter === state.selectedCameraLetter)
        || (take?.cameras || [])[0]
        || null;
      if (fromTake) return fromTake;

      const fallbackLetter = state.selectedCameraLetter || scene?.cameraLetters?.[0] || null;
      if (!fallbackLetter) return null;

      const anyTakeCamera = (scene?.takes || [])
        .flatMap((item) => item.cameras || [])
        .find((camera) => camera.letter === fallbackLetter);
      return anyTakeCamera || null;
    }

    function resolveCameraStill(scene) {
      const shot = state.selectedShot;
      const letter = state.selectedCameraLetter;
      const candidates = (scene?.cameraStills || []).filter((item) => {
        return item.shotNumber === shot && item.cameraLetter === letter;
      });
      if (candidates.length) return candidates[0];
      const shotFallback = (scene?.cameraStills || []).filter((item) => item.shotNumber === shot);
      return shotFallback[0] || null;
    }

    function cameraParameters(camera) {
      const value = (raw) => {
        const trimmed = String(raw ?? "").trim();
        return trimmed.length ? trimmed : labels.noValue;
      };

      return [
        { name: "Camera", value: value(camera?.cameraModel) },
        { name: "Lens", value: value(camera?.lensModel || camera?.lens) },
        { name: "Focal Length", value: value(camera?.focalLength) },
        { name: "Focus Distance", value: value(camera?.focusDistance) },
        { name: "Shutter", value: value(camera?.shutter) },
        { name: "FPS", value: value(camera?.fps) },
        { name: "ISO", value: value(camera?.iso) },
        { name: "WB", value: value(camera?.whiteBalance) },
        { name: "ND Filter", value: value(camera?.ndFilter) },
        { name: "Aperture", value: value(camera?.aperture) },
        { name: "Stop", value: value(camera?.stop) },
        { name: "Aspect", value: value(camera?.aspect) },
        { name: "Movement", value: value(camera?.movement) },
        { name: "Rig", value: value(camera?.rig) }
      ];
    }

    function sceneDisplayNumber(sceneName) {
      const value = String(sceneName || "").trim();
      return value || labels.noValue;
    }

    function sceneLabel(scene) {
      return sceneDisplayNumber(scene?.name);
    }

    function normalizeSceneKey(sceneName) {
      return String(sceneName || "").trim().toLowerCase().replace(/\s+/g, " ");
    }

    function sceneMaterialsForLinks(scene) {
      const key = normalizeSceneKey(scene?.name);
      const value = SCENE_MATERIAL_LINKS[key];
      if (!value) return {};
      return {
        refVideo: String(value.refVideo || "").trim(),
        hdr: String(value.hdr || "").trim()
      };
    }

    function normalizeText(raw) {
      const value = String(raw ?? "").trim();
      return value.length ? value : labels.noValue;
    }

    function openLightbox(src) {
      if (!src) return;
      elements.lightboxImage.src = src;
      elements.lightbox.classList.add("open");
    }

    function closeLightbox() {
      elements.lightbox.classList.remove("open");
      elements.lightboxImage.src = "";
    }

    function escapeHTML(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function escapeAttr(value) {
      return escapeHTML(value);
    }
  </script>
</body>
</html>
